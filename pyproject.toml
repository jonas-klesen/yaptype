[tool.poetry]
name = "yaptype"
version = "0.2.0"
description = "Local transcription service"
authors = ["Jonas Klesen <hello@jonas-klesen.de>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
sounddevice = "^0.5.0"     # Audio recording
numpy = "^1.26.0"          # Data handling
websockets = "^12.0"       # Speaches Realtime API client

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
