[tool.poetry]
name = "yaptype"
version = "0.2.0"
description = "Local transcription service"
authors = ["Jonas Klesen <hello@jonas-klesen.de>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
faster-whisper = "^1.0.0"  # Core transcription
sounddevice = "^0.5.0"     # Audio recording
numpy = "^1.26.0"          # Data handling
scipy = "^1.11.0"          # saving wav files

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"